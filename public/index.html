<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07050f">
  <title>JekInteract</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">

  <!-- Font: dimuat dari Google Fonts bila online; offline tetap aman lewat font cadangan -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800;900&display=swap">

  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar" aria-label="Navigasi"></aside>
    <div id="scrim" class="scrim"></div>
    <div class="main">
      <header id="topbar" class="topbar"></header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modals"></div>
  <!-- Player YouTube Music — persistent, hidup di luar #view agar tidak dihancurkan saat ganti halaman -->
  <div id="yt-music-player" aria-hidden="true" style="position:fixed;left:-9999px;bottom:0;width:2px;height:2px;overflow:hidden;pointer-events:none;z-index:-1;">
    <div id="yt-music-iframe"></div>
  </div>
  <!-- Floating mini-player: iframe overlay music yang persistent.
       Saat di halaman Music → di-embed ke panel preview (class "mu-float-embed").
       Saat pindah menu + ada lagu → muncul di pojok kanan bawah (class "mu-float-mini").
       Saat tidak ada lagu → tersembunyi (default). -->
  <div id="mu-float" aria-label="Mini player musik">
    <a id="mu-float-link" href="#/music" title="Buka halaman Music" aria-label="Balik ke halaman Music"></a>
    <iframe id="mu-float-iframe" src="/overlay/music?preview=1" title="Preview YouTube Music" width="640" height="170" referrerpolicy="same-origin" tabindex="-1"></iframe>
  </div>
  <noscript><p style="padding:24px;color:#fff">JekInteract membutuhkan JavaScript.</p></noscript>
  <script type="module" src="/js/app.js"></script>
  <script src="/js/lib/hmr.js"></script>
</body>
</html>
