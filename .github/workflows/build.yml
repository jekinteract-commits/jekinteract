name: Build Windows EXE

on:
  push:
    branches: [ master ]        # trigger saat push ke branch master
    tags:                       # tetap jalan juga saat push tag
      - 'v*'
  workflow_dispatch:  # bisa juga trigger manual dari tab Actions di GitHub

permissions:
  contents: write   # diperlukan untuk upload ke GitHub Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 3. Install dependencies (skip optional nut-tree yang butuh native build)
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # 4. Download cloudflared.exe dari Cloudflare releases
      - name: Download cloudflared.exe
        shell: pwsh
        run: |
          $version = "latest"
          $url = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          New-Item -ItemType Directory -Force -Path "resources/cloudflared"
          Invoke-WebRequest -Uri $url -OutFile "resources/cloudflared/cloudflared.exe"
          Write-Host "cloudflared.exe downloaded:"
          (Get-Item "resources/cloudflared/cloudflared.exe").Length

      # 5. Build .exe dengan electron-builder
      #    Kalau secrets CSC_LINK + CSC_KEY_PASSWORD diisi (sertifikat code
      #    signing), electron-builder otomatis menandatangani .exe. Kalau
      #    belum diisi, build tetap jalan tanpa signature.
      - name: Build Electron app
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6. Buat checksum SHA-256 supaya teman bisa verifikasi file unduhan
      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      # 7. Upload artifact (tersedia di tab Actions > Artifacts)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JekInteract-Windows-x64
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          retention-days: 30

      # 8. Jika ada tag → buat GitHub Release dan upload exe + checksum
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          append_body: |
            ## Windows SmartScreen / "Unknown publisher"

            File `.exe` ini belum ditandatangani secara digital, jadi Windows
            SmartScreen bisa menampilkan peringatan "Windows protected your PC"
            atau "Unknown publisher". Itu peringatan reputasi file baru, bukan
            bukti virus.

            - Unduh hanya dari halaman Releases repo ini.
            - Cocokkan SHA-256 dengan file `SHA256SUMS.txt`.
            - Kalau yakin, klik **More info → Run anyway**.
            - Kode sumber lengkap tersedia di repo ini dan build dibuat otomatis
              oleh GitHub Actions dari tag release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
