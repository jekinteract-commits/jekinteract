<div class="booyah-alert-wrapper">
  <div class="booyah-badge">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/jekinteract@master/Sobuz/Img/booyah-crate.svg" alt="Airdrop Crate" class="theme-badge-icon">
    <span class="booyah-badge-text">AIRDROP SECURED // ZONE 01</span>
  </div>
  <div class="booyah-alert-card">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/jekinteract@master/Sobuz/Img/booyah-crate.svg" alt="Airdrop Watermark" class="theme-watermark">
    <div class="booyah-content">
<div class="booyah-header">
        <span class="booyah-amount">{amount}</span>
        <span class="booyah-from">{from_text}</span>
        <span class="booyah-supporter">{supporter}</span>
      </div>
      <div class="booyah-message">
        <span class="booyah-msg-text">{message}</span>
      </div>
    </div>
  </div>
</div>
