<div class="horror-alert-wrapper">
  <div class="horror-badge">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/jekinteract@master/Sobuz/Img/horror-skull.svg" alt="Malam Jumat Torch" class="theme-badge-icon">
    <span class="horror-badge-text">MALAM JUMAT // KABUT KERAMAT 🕯️</span>
  </div>
  <div class="horror-alert-card">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/jekinteract@master/Sobuz/Img/horror-skull.svg" alt="Horror Watermark" class="theme-watermark">
    <div class="horror-content">
<div class="horror-header">
        <span class="horror-amount">{amount}</span>
        <span class="horror-from">{from_text}</span>
        <span class="horror-supporter">{supporter}</span>
      </div>
      <div class="horror-message">
        <span class="horror-msg-text">{message}</span>
      </div>
    </div>
  </div>
</div>
