<div class="val-alert-wrapper">
  <div class="val-badge">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/assets-sobuz@main/Sobuz/Img/valorant-vct.svg" alt="Valorant VCT" style="width: 18px; height: 18px; object-fit: contain;">
    <span class="val-badge-text">RADIANITE PROTOCOL // CLUTCH WIN</span>
    <span class="val-badge-tag">DEFUSED</span>
  </div>
  <div class="val-crosshair ch-top"></div>
  <div class="val-crosshair ch-bottom"></div>
  <div class="val-alert-card">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/assets-sobuz@main/Sobuz/Img/valorant-vct.svg" alt="Valorant Watermark" class="val-watermark">
    <div class="val-content">
<div class="val-header">
        <span class="val-amount">{amount}</span>
        <span class="val-from">{from_text}</span>
        <span class="val-supporter">{supporter}</span>
      </div>
      <div class="val-message">
        <span class="val-msg-text">{message}</span>
      </div>
    </div>
  </div>
</div>
