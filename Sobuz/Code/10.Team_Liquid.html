<div class="liquid-alert-wrapper">
  <div class="liquid-badge">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/jekinteract@master/Sobuz/Img/team_liquid_crest.svg" onerror="this.src='https://cdn.prod.website-files.com/64bf6e8cda9043babe7ca006/65f44cd1a36d0e7ade30289b_Crest-on-dark.svg'" alt="Team Liquid Crest" class="liquid-badge-img">
    <span class="liquid-badge-script">Thank You!</span>
  </div>
  <div class="sparkle-liq sp-1"></div>
  <div class="sparkle-liq sp-2"></div>
  <div class="sparkle-liq sp-3"></div>
  <div class="liquid-alert-card">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/jekinteract@master/Sobuz/Img/team_liquid_crest.svg" onerror="this.src='https://cdn.prod.website-files.com/64bf6e8cda9043babe7ca006/65f44cd1a36d0e7ade30289b_Crest-on-dark.svg'" alt="Watermark Liquid" class="liquid-watermark">
    <div class="liquid-content">
<div class="liquid-header">
        <span class="liquid-amount">{amount}</span>
        <span class="liquid-from">{from_text}</span>
        <span class="liquid-supporter">{supporter}</span>
      </div>
      <div class="liquid-message">
        <span class="liquid-msg-text">{message}</span>
      </div>
    </div>
  </div>
</div>
