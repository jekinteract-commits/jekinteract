<div class="jackpot-alert-wrapper">
  <div class="jackpot-badge">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/assets-sobuz@main/Sobuz/Img/jackpot-777.svg" alt="Slot 777 Crest" class="theme-badge-icon">
    <span class="jackpot-badge-text">MEGA JACKPOT 777 // SULTAN DROP 🎰</span>
  </div>
  <div class="jackpot-alert-card">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/assets-sobuz@main/Sobuz/Img/jackpot-777.svg" alt="Jackpot Watermark" class="theme-watermark">
    <div class="jackpot-content">
<div class="jackpot-header">
        <span class="jackpot-amount">{amount}</span>
        <span class="jackpot-from">{from_text}</span>
        <span class="jackpot-supporter">{supporter}</span>
      </div>
      <div class="jackpot-message">
        <span class="jackpot-msg-text">{message}</span>
      </div>
    </div>
  </div>
</div>
