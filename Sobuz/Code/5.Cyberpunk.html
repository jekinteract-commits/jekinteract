<div class="cyber-alert-wrapper">
  <div class="cyber-badge">
    <div class="cyber-badge-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
    </div>
    <span class="cyber-badge-text">DONATION DETECTED // SYS.OK</span>
    <span class="cyber-badge-tag">LVL.MAX</span>
  </div>
  <div class="cyber-bracket bracket-tl"></div>
  <div class="cyber-bracket bracket-tr"></div>
  <div class="cyber-bracket bracket-bl"></div>
  <div class="cyber-bracket bracket-br"></div>
  <div class="cyber-alert-card">
    <div class="cyber-scanline"></div>
    <div class="cyber-content">
<div class="cyber-header">
        <span class="cyber-amount">{amount}</span>
        <span class="cyber-from">{from_text}</span>
        <span class="cyber-supporter">{supporter}</span>
      </div>
      <div class="cyber-message">
        <span class="cyber-msg-text">{message}</span>
      </div>
    </div>
  </div>
</div>
