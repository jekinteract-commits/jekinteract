<div class="sakura-alert-wrapper">
  <div class="sakura-badge">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/jekinteract@master/Sobuz/Img/sakura-flower.svg" alt="Sakura Flower" class="theme-badge-icon">
    <span class="sakura-badge-text">Arigatou!</span>
    <span class="sakura-heart">💖</span>
  </div>
  <div class="sakura-petal petal-1">🌸</div>
  <div class="sakura-petal petal-2">🌸</div>
  <div class="sakura-sparkle sparkle-cute-1">✨</div>
  <div class="sakura-sparkle sparkle-cute-2">✨</div>
  <div class="sakura-alert-card">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/jekinteract@master/Sobuz/Img/sakura-flower.svg" alt="Sakura Watermark" class="theme-watermark">
    <div class="sakura-content">
<div class="sakura-header">
        <span class="sakura-amount">{amount}</span>
        <span class="sakura-from">{from_text}</span>
        <span class="sakura-supporter">{supporter}</span>
      </div>
      <div class="sakura-message">
        <span class="sakura-msg-icon">💌</span>
        <span class="sakura-msg-text">{message}</span>
      </div>
    </div>
  </div>
</div>
