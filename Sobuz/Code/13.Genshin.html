<div class="genshin-alert-wrapper">
  <div class="genshin-badge">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/assets-sobuz@main/Sobuz/Img/genshin-star.svg" alt="5-Star Primogem" class="theme-badge-icon">
    <span class="genshin-badge-text">5-STAR WISH // STELLAR WARP ★★★★★</span>
  </div>
  <div class="genshin-alert-card">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/assets-sobuz@main/Sobuz/Img/genshin-star.svg" alt="Genshin Star Watermark" class="theme-watermark">
    <div class="genshin-content">
<div class="genshin-header">
        <span class="genshin-amount">{amount}</span>
        <span class="genshin-from">{from_text}</span>
        <span class="genshin-supporter">{supporter}</span>
      </div>
      <div class="genshin-message">
        <span class="genshin-msg-text">{message}</span>
      </div>
    </div>
  </div>
</div>
