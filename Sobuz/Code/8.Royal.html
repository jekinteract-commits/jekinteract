<div class="royal-alert-wrapper">
  <div class="royal-badge">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/assets-sobuz@main/Sobuz/Img/royal-crown.svg" alt="Royal Crown" class="theme-badge-icon">
    <span class="royal-badge-text">ROYAL PATRON</span>
    <span class="royal-badge-seal">⚜️</span>
  </div>
  <div class="royal-sparkle dust-1">✦</div>
  <div class="royal-sparkle dust-2">✦</div>
  <div class="royal-alert-card">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/assets-sobuz@main/Sobuz/Img/royal-crown.svg" alt="Royal Watermark" class="theme-watermark">
    <div class="royal-corner c-top-left"></div>
    <div class="royal-corner c-top-right"></div>
    <div class="royal-corner c-bottom-left"></div>
    <div class="royal-corner c-bottom-right"></div>
    <div class="royal-content">
<div class="royal-header">
        <span class="royal-amount">{amount}</span>
        <span class="royal-from">{from_text}</span>
        <span class="royal-supporter">{supporter}</span>
      </div>
      <div class="royal-message">
        <span class="royal-quote">“</span>
        <span class="royal-msg-text">{message}</span>
        <span class="royal-quote">”</span>
      </div>
    </div>
  </div>
</div>
