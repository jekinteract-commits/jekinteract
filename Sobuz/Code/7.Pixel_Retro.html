<div class="pixel-alert-wrapper">
  <div class="pixel-badge">
    <span class="pixel-badge-coin">🪙</span>
    <span class="pixel-badge-text">1-UP DONATION!</span>
    <span class="pixel-badge-star">★</span>
  </div>
  <div class="pixel-alert-card">
    <div class="pixel-crt-lines"></div>
    <div class="pixel-content">
<div class="pixel-header">
        <span class="pixel-amount">{amount}</span>
        <span class="pixel-from">{from_text}</span>
        <span class="pixel-supporter">{supporter}</span>
      </div>
      <div class="pixel-message">
        <span class="pixel-cursor">&gt;&gt;</span>
        <span class="pixel-msg-text">{message}</span>
      </div>
    </div>
  </div>
</div>
