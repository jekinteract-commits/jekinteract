<div class="fut-alert-wrapper">
  <div class="fut-badge">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/jekinteract@master/Sobuz/Img/fut-trophy.svg" alt="FUT Gold Trophy" class="theme-badge-icon">
    <span class="fut-badge-text">OVR 99 // MATCH WINNER ⚽</span>
  </div>
  <div class="fut-alert-card">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/jekinteract@master/Sobuz/Img/fut-trophy.svg" alt="Trophy Watermark" class="theme-watermark">
    <div class="fut-content">
<div class="fut-header">
        <span class="fut-amount">{amount}</span>
        <span class="fut-from">{from_text}</span>
        <span class="fut-supporter">{supporter}</span>
      </div>
      <div class="fut-message">
        <span class="fut-msg-text">{message}</span>
      </div>
    </div>
  </div>
</div>
