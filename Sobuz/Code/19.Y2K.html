<div class="y2k-alert-wrapper">
  <div class="y2k-badge">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/jekinteract@master/Sobuz/Img/y2k-floppy.svg" alt="Win98 Floppy" class="theme-badge-icon">
    <span class="y2k-badge-text">SYSTEM_ALERT.EXE // 100% OK 💾</span>
  </div>
  <div class="y2k-alert-card">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/jekinteract@master/Sobuz/Img/y2k-floppy.svg" alt="Floppy Watermark" class="theme-watermark">
    <div class="y2k-content">
<div class="y2k-header">
        <span class="y2k-amount">{amount}</span>
        <span class="y2k-from">{from_text}</span>
        <span class="y2k-supporter">{supporter}</span>
      </div>
      <div class="y2k-message">
        <span class="y2k-msg-text">{message}</span>
      </div>
    </div>
  </div>
</div>
