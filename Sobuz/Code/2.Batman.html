<div class="batman-alert-wrapper">
  <div class="batman-badge">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/assets-sobuz@main/Sobuz/Img/batman-symbol.svg" alt="Bat Emblem" style="width: 22px; height: 16px; object-fit: contain;">
    <span class="batman-badge-text">GOTHAM CITY // BAT-SIGNAL ACTIVE</span>
  </div>
  <div class="bat-searchlight"></div>
  <div class="batman-alert-card">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/assets-sobuz@main/Sobuz/Img/batman-symbol.svg" alt="Bat Watermark" class="batman-watermark">
    <div class="batman-content">
<div class="batman-header">
        <span class="batman-amount">{amount}</span>
        <span class="batman-from">{from_text}</span>
        <span class="batman-supporter">{supporter}</span>
      </div>
      <div class="batman-message">
        <span class="batman-msg-text">{message}</span>
      </div>
    </div>
  </div>
</div>
