<div class="drift-alert-wrapper">
  <div class="drift-badge">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/assets-sobuz@main/Sobuz/Img/drift-rpm.svg" alt="Racing Tachometer" class="theme-badge-icon">
    <span class="drift-badge-text">NITRO BOOST // 9000 RPM 🏁</span>
  </div>
  <div class="drift-alert-card">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/assets-sobuz@main/Sobuz/Img/drift-rpm.svg" alt="Drift Watermark" class="theme-watermark">
    <div class="drift-content">
<div class="drift-header">
        <span class="drift-amount">{amount}</span>
        <span class="drift-from">{from_text}</span>
        <span class="drift-supporter">{supporter}</span>
      </div>
      <div class="drift-message">
        <span class="drift-msg-text">{message}</span>
      </div>
    </div>
  </div>
</div>
