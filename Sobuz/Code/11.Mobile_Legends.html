<div class="mlbb-alert-wrapper">
  <div class="mlbb-badge">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/jekinteract@master/Sobuz/Img/mlbb-wing.svg" alt="MLBB Mythic Crest" class="theme-badge-icon">
    <span class="mlbb-badge-text">MYTHICAL GLORY // RANK UP ★</span>
  </div>
  <div class="mlbb-alert-card">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/jekinteract@master/Sobuz/Img/mlbb-wing.svg" alt="MLBB Watermark" class="theme-watermark">
    <div class="mlbb-content">
<div class="mlbb-header">
        <span class="mlbb-amount">{amount}</span>
        <span class="mlbb-from">{from_text}</span>
        <span class="mlbb-supporter">{supporter}</span>
      </div>
      <div class="mlbb-message">
        <span class="mlbb-msg-text">{message}</span>
      </div>
    </div>
  </div>
</div>
