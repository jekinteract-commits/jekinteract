<div class="lofi-alert-wrapper">
  <div class="lofi-badge">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/assets-sobuz@main/Sobuz/Img/lofi-cup.svg" alt="Lofi Cup Crest" class="theme-badge-icon">
    <span class="lofi-badge-text">COZY CAFE // LOFI VIBES ☕</span>
  </div>
  <div class="lofi-alert-card">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/assets-sobuz@main/Sobuz/Img/lofi-cup.svg" alt="Lofi Watermark" class="theme-watermark">
    <div class="lofi-content">
<div class="lofi-header">
        <span class="lofi-amount">{amount}</span>
        <span class="lofi-from">{from_text}</span>
        <span class="lofi-supporter">{supporter}</span>
      </div>
      <div class="lofi-message">
        <span class="lofi-msg-text">{message}</span>
      </div>
    </div>
  </div>
</div>
