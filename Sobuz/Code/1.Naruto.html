<div class="naruto-alert-wrapper">
  <div class="naruto-badge">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/assets-sobuz@main/Sobuz/Img/naruto-konoha.svg" alt="Konoha Leaf" class="naruto-badge-img">
    <span class="naruto-badge-text">SHINOBI SCROLL // DATTEBAYO!</span>
    <span class="naruto-shuriken">✦</span>
  </div>
  <div class="chakra-flame flame-1">🔥</div>
  <div class="chakra-flame flame-2">🌀</div>
  <div class="naruto-alert-card">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/assets-sobuz@main/Sobuz/Img/naruto-konoha.svg" alt="Konoha Watermark" class="naruto-watermark">
    <div class="naruto-content">
<div class="naruto-header">
        <span class="naruto-amount">{amount}</span>
        <span class="naruto-from">{from_text}</span>
        <span class="naruto-supporter">{supporter}</span>
      </div>
      <div class="naruto-message">
        <span class="naruto-msg-icon">📜</span>
        <span class="naruto-msg-text">{message}</span>
      </div>
    </div>
  </div>
</div>
