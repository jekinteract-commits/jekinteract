<div class="gothic-alert-wrapper">
  <div class="gothic-badge">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/jekinteract@master/Sobuz/Img/gothic-bat.svg" alt="Vampire Bat Crest" class="theme-badge-icon">
    <span class="gothic-badge-text">BLOOD MOON // VAMPIRE SANCTUM 🩸</span>
  </div>
  <div class="gothic-alert-card">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/jekinteract@master/Sobuz/Img/gothic-bat.svg" alt="Bat Watermark" class="theme-watermark">
    <div class="gothic-content">
<div class="gothic-header">
        <span class="gothic-amount">{amount}</span>
        <span class="gothic-from">{from_text}</span>
        <span class="gothic-supporter">{supporter}</span>
      </div>
      <div class="gothic-message">
        <span class="gothic-msg-text">{message}</span>
      </div>
    </div>
  </div>
</div>
