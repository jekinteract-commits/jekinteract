<div class="jjk-alert-wrapper">
  <div class="jjk-badge">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/assets-sobuz@main/Sobuz/Img/jjk-curse.svg" alt="Cursed Energy Crest" class="theme-badge-icon">
    <span class="jjk-badge-text">RYOIKI TENKAI // DOMAIN EXPANSION</span>
  </div>
  <div class="jjk-alert-card">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/assets-sobuz@main/Sobuz/Img/jjk-curse.svg" alt="JJK Watermark" class="theme-watermark">
    <div class="jjk-content">
<div class="jjk-header">
        <span class="jjk-amount">{amount}</span>
        <span class="jjk-from">{from_text}</span>
        <span class="jjk-supporter">{supporter}</span>
      </div>
      <div class="jjk-message">
        <span class="jjk-msg-text">{message}</span>
      </div>
    </div>
  </div>
</div>
