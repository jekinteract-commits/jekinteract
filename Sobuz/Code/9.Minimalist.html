<div class="minimal-alert-wrapper">
  <div class="minimal-badge">
    <span class="minimal-status-dot"></span>
    <span class="minimal-badge-text">NEW SUPPORTER</span>
  </div>
  <div class="minimal-alert-card">
    <div class="minimal-content">
<div class="minimal-header">
        <span class="minimal-amount">{amount}</span>
        <span class="minimal-separator">/</span>
        <span class="minimal-from">{from_text}</span>
        <span class="minimal-supporter">{supporter}</span>
      </div>
      <div class="minimal-message">
        <span class="minimal-msg-text">{message}</span>
      </div>
    </div>
  </div>
</div>
