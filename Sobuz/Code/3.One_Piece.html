<div class="pirate-alert-wrapper">
  <div class="pirate-badge">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/jekinteract@master/Sobuz/Img/onepiece-strawhat.svg" alt="Straw Hat Crest" style="width: 22px; height: 22px; object-fit: contain;">
    <span class="pirate-badge-text">PIRATE BOUNTY // WANTED</span>
    <span class="pirate-star">★</span>
  </div>
  <div class="pirate-alert-card">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/jekinteract@master/Sobuz/Img/onepiece-strawhat.svg" alt="Jolly Roger Watermark" class="pirate-watermark">
    <div class="pirate-content">
<div class="pirate-header">
        <span class="pirate-berry">฿</span>
        <span class="pirate-amount">{amount}</span>
        <span class="pirate-from">{from_text}</span>
        <span class="pirate-supporter">{supporter}</span>
      </div>
      <div class="pirate-message">
        <span class="pirate-msg-icon">🍖</span>
        <span class="pirate-msg-text">{message}</span>
      </div>
    </div>
  </div>
</div>
