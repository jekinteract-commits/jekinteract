<div class="demonslayer-alert-wrapper">
  <div class="demonslayer-badge">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/jekinteract@master/Sobuz/Img/demonslayer-blade.svg" alt="Sun Blade Crest" class="theme-badge-icon">
    <span class="demonslayer-badge-text">HINOKAMI KAGURA // SUN BREATHING</span>
  </div>
  <div class="demonslayer-alert-card">
    <img src="https://cdn.jsdelivr.net/gh/jekinteract-commits/jekinteract@master/Sobuz/Img/demonslayer-blade.svg" alt="Flame Watermark" class="theme-watermark">
    <div class="demonslayer-content">
<div class="demonslayer-header">
        <span class="demonslayer-amount">{amount}</span>
        <span class="demonslayer-from">{from_text}</span>
        <span class="demonslayer-supporter">{supporter}</span>
      </div>
      <div class="demonslayer-message">
        <span class="demonslayer-msg-text">{message}</span>
      </div>
    </div>
  </div>
</div>
